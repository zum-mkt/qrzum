name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          url="${{ secrets.SUPABASE_URL }}"
          url="${url%/}/rest/v1/"
          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            "$url")
          echo "HTTP status: $status"
          echo "Response body:"
          cat response.txt
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase ping failed with status $status"
            exit 1
          fi
